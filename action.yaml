name: "MTGA Podcast Generator"
author: "John Podcast"
description: "Genereates a feed for a podcast from a YAML file"
runs:   
  using: "docker"
  image: "Dockerfile"
branding: 
  icon: "git-branch"
  color: "red"
inputs: 
  email: 
    description: Committer's email address
    required: true 
    default: ${{ github.action}}@localhost
  name: 
    description: The comitter's name
    required: true 
    default: ${{ github.actor }}@localhost
